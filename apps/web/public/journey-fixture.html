<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Journey test fixture</title>
  </head>
  <body>
    <main>
      <h1>Controlled registration form</h1>
      <p>
        This form does not submit data. It exists for local keyboard journey
        tests.
      </p>
      <form onsubmit="return false;">
        <label
          >Email <input id="email" type="email" autocomplete="off"
        /></label>
        <label
          >Password <input id="password" type="password" autocomplete="off"
        /></label>
        <button type="button">Continue</button>
      </form>
    </main>
  </body>
</html>
